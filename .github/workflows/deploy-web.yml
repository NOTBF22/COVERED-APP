# Builds the web version of Covered and publishes it to GitHub Pages
# (https://notbf22.github.io/covered-app/) on every push to main.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Serve from /covered-app (Pages sub-path)
        run: |
          node -e '
            const fs = require("fs");
            const a = JSON.parse(fs.readFileSync("app.json"));
            a.expo.experiments = { ...a.expo.experiments, baseUrl: "/covered-app" };
            fs.writeFileSync("app.json", JSON.stringify(a, null, 2));'
      - run: npx tsc --noEmit
      - run: npx expo export --platform web
        env:
          CI: 1
      # Let deep links and refreshes fall back to the app.
      - run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
